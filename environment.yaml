# conda environment for this project, create it with:
#   conda env create -f environment.yaml
#
# major versions are pinned so that everyone gets compatible minor/patch releases;
# the anaconda `pytorch` channel is no longer updated, so everything comes from conda-forge

name: lightning-hydra-template

channels:
  - conda-forge

dependencies:
  - python=3.12
  - pytorch=2.*
  - torchvision=0.*
  - lightning=2.*
  - torchmetrics=1.*
  - hydra-core=1.3.*
  - rich>=13
  - pytest=8.*
  - pre-commit=4.*
  - pip

  # --------- loggers --------- #
  # - tensorboard
  # - wandb

  - pip:
      - hydra-colorlog==1.2.0
      - rootutils
      - sh
