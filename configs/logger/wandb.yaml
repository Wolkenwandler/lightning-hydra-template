# https://wandb.ai

wandb:
  _target_: src.utils.trackers.WandbTracker
  _convert_: all # pass plain python lists (e.g. tags) to wandb
  project: "lightning-hydra-template"
  save_dir: "${paths.output_dir}"
  # runs are only written locally to <output_dir>/wandb/offline-run-*;
  # upload them later with `wandb sync <output_dir>/wandb/offline-run-*`
  offline: True
  # further keys are passed to `wandb.init`, e.g. name, entity, group, tags
