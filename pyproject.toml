[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lightning-hydra-template"
version = "0.1.0"
description = "PyTorch Lightning + Hydra template for deep learning experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4",
  "torchvision>=0.19",
  "lightning>=2.4,<3",
  "torchmetrics>=1.4",
  "hydra-core>=1.3.2,<1.4",
  "hydra-colorlog>=1.2",
  "rootutils>=1.0.7",
  "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pre-commit>=4", "sh>=2"]

# global commands available after `pip install -e .`
[project.scripts]
train_command = "src.train:main"
eval_command = "src.eval:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
addopts = [
  "--color=yes",
  "--durations=0",
  "--strict-markers",
  "--doctest-modules",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]
log_cli = "True"
markers = [
  "slow: slow tests",
]
minversion = "8.0"
testpaths = "tests/"

[tool.coverage.report]
exclude_lines = [
    "pragma: nocover",
    "raise NotImplementedError",
    "raise NotImplementedError()",
    "if __name__ == .__main__.:",
]
